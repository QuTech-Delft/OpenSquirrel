name: Build and Publish wheels

on:
  pull_request:
  push:
    branches:
      - "release-*"
  release:
    types:
      - created

env:
  UV_USE_ACTIVE_ENV: 1

jobs:
  publish:
    name: Publish assets
    runs-on: "ubuntu-latest"
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@master
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "latest"

      # Setting the proper version
      - name: Get previous Tag
        if: contains(github.ref, 'refs/heads/release-')
        id: previous_tag
        uses: WyriHaximus/github-action-get-previous-tag@v2
        with:
          fallback: 0.1.0
      - name: Set Build version
        if: contains(github.ref, 'refs/heads/release-')
        run: uv version "${{ steps.previous_tag.outputs.tag }}.dev${{ github.run_number }}"
      - name: Set Release version
        if: github.event_name == 'release' && github.event.action == 'created'
        run: uv version ${{ github.ref_name }}

      # Build package
      - name: Build uv package
        run: uv build

      # Publishing the package
      - name: Publish distribution 📦 to Test PyPI
        if: contains(github.ref, 'refs/heads/release-')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: true
      - name: Publish distribution 📦 to PyPI
        if: github.event_name == 'release' && github.event.action == 'created'
        uses: pypa/gh-action-pypi-publish@release/v1
